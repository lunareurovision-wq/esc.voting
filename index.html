<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eurovision Song Contest - Voting</title>
  <!-- SDK Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #1a103c 50%, #0f0c20 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-pink: #d10078;
      --accent-cyan: #00f0ff;
      --text-color: #ffffff;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .screen { width: 100%; max-width: 600px; text-align: center; }
    .hidden { display: none !important; }

    .logo-container { margin: 15px 0 25px; }
    .main-logo { width: 100%; max-width: 260px; height: auto; }

    .btn-main {
      background: linear-gradient(90deg, #d10078, #00f0ff);
      border: none;
      color: #ffffff;
      padding: 12px 28px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    .btn-main:active { transform: scale(0.96); }

    .instructions-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: #ffffff;
    }

    .counter-badge {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin: 8px 0;
    }

    .error-msg { color: #ff3366; font-weight: 600; font-size: 0.85rem; margin: 8px 0; min-height: 20px; }

    .country-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 12px;
    }

    .country-info { display: flex; align-items: center; gap: 10px; text-align: left; }
    .country-num { font-size: 0.8rem; font-weight: 700; color: #ffffff; opacity: 0.6; width: 18px; }
    
    .artist-img-container { position: relative; width: 48px; height: 48px; }
    .artist-img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 1px solid var(--card-border); }
    .flag-mini { position: absolute; bottom: 0px; right: -2px; width: 18px; height: 12px; border-radius: 2px; box-shadow: 0 0 4px rgba(0,0,0,0.8); object-fit: cover; }

    .song-details { display: flex; flex-direction: column; }
    .country-name { font-weight: 700; font-size: 0.9rem; text-transform: uppercase; color: #ffffff; }
    .song-title { font-size: 0.8rem; color: #ffffff; opacity: 0.9; font-weight: 600; }
    .artist-name { font-size: 0.75rem; color: #ffffff; opacity: 0.6; }

    .controls { display: flex; align-items: center; gap: 8px; }
    .btn-step {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid var(--card-border);
      color: #ffffff;
      width: 30px; height: 30px; border-radius: 50%;
      font-size: 1.1rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .vote-num { font-weight: 700; width: 18px; text-align: center; font-size: 0.95rem; color: #ffffff; }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 0, 15, 0.88); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-box {
      background: #120924; border: 1px solid var(--card-border);
      padding: 20px; border-radius: 16px; width: 90%; max-width: 550px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .modal-box-large { max-width: 95%; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; }

    input[type="password"], input[type="email"], input[type="number"] {
      width: 100%; padding: 10px; margin: 8px 0;
      border-radius: 8px; border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.05); color: #ffffff; text-align: center;
    }

    .summary-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: rgba(255,255,255,0.05); margin: 6px 0;
      border-radius: 8px; border: 1px solid var(--card-border);
    }
    .summary-info { display: flex; align-items: center; gap: 10px; }
    .summary-flag { width: 22px; height: 15px; border-radius: 2px; object-fit: cover; }

    .table-wrapper {
      overflow-x: auto; overflow-y: auto; max-height: 50vh;
      margin: 15px 0; border: 1px solid var(--card-border); border-radius: 8px;
    }

    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; color: #ffffff; }
    th, td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); white-space: nowrap; }
    th { background: rgba(255, 255, 255, 0.1); font-weight: 700; position: sticky; top: 0; }

    .btn-secondary {
      background: rgba(255,255,255,0.1); border: 1px solid var(--card-border); color: #ffffff;
      padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; margin: 4px;
    }
    .btn-danger { background: #ff3366; border: none; color: #ffffff; }
  </style>
</head>
<body>

  <!-- PANTALLA 1: BIENVENIDA -->
  <div id="screen-welcome" class="screen">
    <div class="logo-container">
      <img src="https://media.discordapp.net/attachments/844267329092059216/1539512421855793192/ESC_LOGO_WHITE.png?ex=6a873eec&is=6a85ed6c&hm=7099df4de0d85f97adb57877b86c088df0c8ac78ba1e1067416653881831b7c8&=&format=webp&quality=lossless" class="main-logo" alt="Eurovision Logo">
    </div>
    <button class="btn-main" onclick="goToLanguage()">Vote Now</button>
  </div>

  <!-- PANTALLA 2: IDIOMA -->
  <div id="screen-language" class="screen hidden">
    <h2 style="margin-bottom: 25px; color: #ffffff;">Select Language</h2>
    <button class="btn-main" style="display:block; width:100%; margin: 10px 0;" onclick="selectLanguage('es')">Español</button>
    <button class="btn-main" style="display:block; width:100%; margin: 10px 0;" onclick="selectLanguage('en')">English</button>
    <button class="btn-main" style="display:block; width:100%; margin: 10px 0;" onclick="selectLanguage('fr')">Français</button>
  </div>

  <!-- PANTALLA 3: VOTACIÓN -->
  <div id="screen-voting" class="screen hidden">
    <div class="instructions-box" id="instruction-text"></div>
    <div id="counter-status" class="counter-badge"></div>
    <div id="error-display" class="error-msg"></div>

    <div id="country-list"></div>

    <button class="btn-main" onclick="openSummaryModal()" style="margin-top: 15px; width: 100%;">Vote</button>
  </div>

  <!-- PIE DE PÁGINA STAFF -->
  <div style="margin-top: auto; padding-top: 25px;">
    <button onclick="openStaffModal()" style="background:none; border:none; color: rgba(255,255,255,0.4); cursor:pointer; font-size: 0.8rem;">Staff</button>
  </div>

  <!-- MODAL DE RESUMEN Y DATOS DEL VOTANTE -->
  <div id="summary-modal" class="modal hidden">
    <div class="modal-box">
      <h3 style="margin-top:0; color:#ffffff;">Resumen de Votación</h3>
      <p style="font-size:0.85rem; color:#cccccc;">Introduce tus datos para registrar el voto:</p>
      
      <input type="email" id="voter-email" placeholder="Correo electrónico" required>
      <input type="number" id="voter-age" placeholder="Edad" min="1" max="120" required>
      <div id="summary-error" class="error-msg"></div>

      <div id="summary-list" style="max-height: 180px; overflow-y: auto; margin: 12px 0;"></div>
      <button class="btn-main" style="width:100%;" onclick="submitVote()">Confirmar Voto</button>
      <button class="btn-secondary" style="width:100%; margin-top:8px;" onclick="closeSummaryModal()">Volver</button>
    </div>
  </div>

  <!-- MODAL STAFF DESGLOSE EN TABLA -->
  <div id="staff-modal" class="modal hidden">
    <div class="modal-box modal-box-large">
      <h3 style="margin-top:0; color:#ffffff;">Acceso Staff</h3>
      <div id="staff-auth">
        <input type="password" id="staff-pass" placeholder="Contraseña">
        <button class="btn-main" style="width:100%;" onclick="checkStaffPass()">Entrar</button>
        <button onclick="closeStaffModal()" class="btn-secondary" style="width:100%; margin-top:8px;">Cancelar</button>
      </div>
      <div id="staff-results" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
        <h3 style="margin: 0; color: #ffffff;">Desglose de Votaciones (Ordenado por Total)</h3>
        <div class="table-wrapper">
          <table id="split-table">
            <thead><tr id="table-header"></tr></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top: auto;">
          <button class="btn-secondary btn-danger" onclick="resetVotes()">Resetear Votos</button>
          <button class="btn-secondary" onclick="exportCSV()">Descargar CSV</button>
        </div>
        <button class="btn-main" style="width:100%; margin-top:12px;" onclick="closeStaffModal()">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // Configuración de tu proyecto eurovision-votos
    const firebaseConfig = {
      apiKey: "AIzaSyCaPYwjRxUib9NFAtNyrAqY2Ie3gd0B32U",
      authDomain: "eurovision-votos.firebaseapp.com",
      databaseURL: "https://eurovision-votos-default-rtdb.firebaseio.com",
      projectId: "eurovision-votos",
      storageBucket: "eurovision-votos.appspot.com"
    };
    
    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const countries = [
      { id: "01", name: "Bulgaria", code: "bg", song: "Луда", artist: "NICKA", image: "https://www.loud-mag.com/wp-content/uploads/2025/04/orig-2.jpg" },
      { id: "02", name: "Andorra", code: "ad", song: "SELENA", artist: "Daniela Blasco", image: "https://images.genius.com/b01e3d9cb9c2aaf0f1d6608ed61c254b.1000x1000x1.jpg" },
      { id: "03", name: "Canada", code: "ca", song: "Unethical", artist: "Faouzia", image: "https://canadianimmigrant.ca/wp-content/uploads/Faouzia-1024x682.jpg" },
      { id: "04", name: "France", code: "fr", song: "Mieux que moi", artist: "Slimane", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSh62tlreHlvvvgslcAtfxzywv0VXPj12PbEe8W3ZTLhJI5gWWYppY_VD0&s=10" },
      { id: "05", name: "Germany", code: "de", song: "joyride", artist: "Maggie Lindemann", image: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/Maggie_Lindemann_-_2023155142512_2023-06-04_Rock_am_Ring_-_Sven_-_1D_X_MK_II_-_0291_-_B70I9452.jpg/1280px-Maggie_Lindemann_-_2023155142512_2023-06-04_Rock_am_Ring_-_Sven_-_1D_X_MK_II_-_0291_-_B70I9452.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail" },
      { id: "06", name: "Iceland", code: "is", song: "Oceania", artist: "Björk", image: "https://img.olympics.com/images/image/private/t_1-1_1280/primary/t9t8mtv9z8qbjpybhxow" },
      { id: "07", name: "Latvia", code: "lv", song: "MATRICA POLKA", artist: "Polka Band", image: "https://i.scdn.co/image/ab67616d00001e02849c63fe60a2ff5e4f408c60" },
      { id: "08", name: "Norway", code: "no", song: "Rear View", artist: "MoyKa", image: "https://i.scdn.co/image/ab67616d00001e02d0150c2c2e0fe4ee640d0394" },
      { id: "09", name: "UK", code: "gb", song: "Angel Of My Dreams", artist: "JADE", image: "https://diy-magazine.s3.eu-west-1.amazonaws.com/d/diy/Artists/J/JADE/_1500x1000_crop_center-center_100_line/JADE-Angel-of-My-Dreams-SAD-August-2024.jpg" },
      { id: "10", name: "Spain", code: "es", song: "E UN DELIRIO", artist: "Cris Lora", image: "https://i.scdn.co/image/ab6761610000e5eb19a3adb5015912d1ab32e39c" },
      { id: "11", name: "Sweden", code: "se", song: "He Don't Love Me", artist: "Winona Oak", image: "https://www.mysticsons.com/sites/default/files/styles/large/public/17711/feature/unnamed-52.png?itok=1nC_jELe" }
    ];

    let votes = {};
    let currentLang = 'es';
    let globalHistory = [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq) {
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    const translations = {
      es: {
        instr: "Debes repartir exactamente 20 votos entre un mínimo de 4 países.",
        rem: "Votos restantes: ",
        errMin: "Debes votar al menos a 4 países diferentes.",
        errTotal: "Debes repartir exactamente los 20 votos."
      },
      en: {
        instr: "You must distribute exactly 20 votes among at least 4 countries.",
        rem: "Remaining votes: ",
        errMin: "You must vote for at least 4 different countries.",
        errTotal: "You must distribute exactly 20 votes."
      },
      fr: {
        instr: "Vous devez distribuer exactement 20 votes entre au moins 4 pays.",
        rem: "Votes restants: ",
        errMin: "Vous devez voter pour au moins 4 pays différents.",
        errTotal: "Vous devez distribuer exactement les 20 votes."
      }
    };

    function goToLanguage() {
      playSound(500);
      document.getElementById('screen-welcome').classList.add('hidden');
      document.getElementById('screen-language').classList.remove('hidden');
    }

    function selectLanguage(lang) {
      playSound(600);
      currentLang = lang;
      document.getElementById('screen-language').classList.add('hidden');
      document.getElementById('screen-voting').classList.remove('hidden');
      initVoting();
    }

    function initVoting() {
      document.getElementById('instruction-text').innerText = translations[currentLang].instr;
      const listContainer = document.getElementById('country-list');
      listContainer.innerHTML = '';
      
      countries.forEach(c => {
        votes[c.name] = 0;
        const card = document.createElement('div');
        card.className = 'country-card';
        card.innerHTML = `
          <div class="country-info">
            <span class="country-num">${c.id}</span>
            <div class="artist-img-container">
              <img src="${c.image}" class="artist-img" alt="${c.artist}">
              <img src="https://flagcdn.com/w40/${c.code}.png" class="flag-mini" alt="${c.name}">
            </div>
            <div class="song-details">
              <span class="country-name">${c.name}</span>
              <span class="song-title">${c.song}</span>
              <span class="artist-name">${c.artist}</span>
            </div>
          </div>
          <div class="controls">
            <button class="btn-step" onclick="changeVote('${c.name}', -1)">-</button>
            <span id="count-${c.name}" class="vote-num">0</span>
            <button class="btn-step" onclick="changeVote('${c.name}', 1)">+</button>
          </div>
        `;
        listContainer.appendChild(card);
      });
      updateCounterDisplay();
    }

    function changeVote(country, delta) {
      const totalUsed = Object.values(votes).reduce((a, b) => a + b, 0);
      if (delta > 0 && totalUsed >= 20) return;
      if (votes[country] + delta < 0) return;

      votes[country] += delta;
      document.getElementById(`count-${country}`).innerText = votes[country];
      playSound(delta > 0 ? 700 : 350);
      updateCounterDisplay();
    }

    function updateCounterDisplay() {
      const totalUsed = Object.values(votes).reduce((a, b) => a + b, 0);
      document.getElementById('counter-status').innerText = `${translations[currentLang].rem} ${20 - totalUsed}`;
    }

    function openSummaryModal() {
      const activeCountries = Object.values(votes).filter(v => v > 0).length;
      const totalVotes = Object.values(votes).reduce((a, b) => a + b, 0);
      const errorEl = document.getElementById('error-display');

      if (activeCountries < 4) {
        errorEl.innerText = translations[currentLang].errMin;
        playSound(200);
        return;
      }
      if (totalVotes !== 20) {
        errorEl.innerText = translations[currentLang].errTotal;
        playSound(200);
        return;
      }
      errorEl.innerText = '';
      playSound(800);

      const summaryList = document.getElementById('summary-list');
      summaryList.innerHTML = '';
      countries.forEach(c => {
        if (votes[c.name] > 0) {
          summaryList.innerHTML += `
            <div class="summary-card">
              <div class="summary-info">
                <img src="https://flagcdn.com/w40/${c.code}.png" class="summary-flag">
                <span style="font-weight:700; font-size:0.9rem;">${c.name}</span>
              </div>
              <strong style="color:var(--accent-cyan);">${votes[c.name]} votos</strong>
            </div>
          `;
        }
      });
      document.getElementById('summary-modal').classList.remove('hidden');
    }

    function closeSummaryModal() { document.getElementById('summary-modal').classList.add('hidden'); }

    function submitVote() {
      const email = document.getElementById('voter-email').value.trim().toLowerCase();
      const age = document.getElementById('voter-age').value.trim();
      const summaryErr = document.getElementById('summary-error');

      if (!email || !email.includes('@')) {
        summaryErr.innerText = "Introduce un correo electrónico válido.";
        playSound(200); return;
      }
      if (!age || age < 1 || age > 120) {
        summaryErr.innerText = "Introduce una edad válida.";
        playSound(200); return;
      }

      db.ref('votes').once('value', snapshot => {
        const data = snapshot.val() || {};
        const emails = Object.values(data).map(v => v.email);

        if (emails.includes(email)) {
          summaryErr.innerText = "Este correo electrónico ya ha emitido un voto.";
          playSound(200);
          return;
        }

        const newVoteRef = db.ref('votes').push();
        newVoteRef.set({
          email: email,
          age: age,
          lang: currentLang.toUpperCase(),
          votes: votes,
          timestamp: Date.now()
        }).then(() => {
          playSound(900);
          alert("¡Gracias por votar / Thank you for voting!");
          location.reload();
        });
      });
    }

    function openStaffModal() { 
      document.getElementById('staff-pass').value = '';
      document.getElementById('staff-auth').classList.remove('hidden');
      document.getElementById('staff-results').classList.add('hidden');
      document.getElementById('staff-modal').classList.remove('hidden'); 
    }
    
    function closeStaffModal() { document.getElementById('staff-modal').classList.add('hidden'); }
    
    function checkStaffPass() {
      if (document.getElementById('staff-pass').value === '14mayo') {
        playSound(700);
        document.getElementById('staff-auth').classList.add('hidden');
        document.getElementById('staff-results').classList.remove('hidden');
        fetchAndRenderSplitTable();
      } else {
        playSound(200);
        alert('Contraseña incorrecta');
      }
    }

    function fetchAndRenderSplitTable() {
      db.ref('votes').once('value', snapshot => {
        const data = snapshot.val() || {};
        globalHistory = Object.values(data);
        renderSplitTable();
      });
    }

    function renderSplitTable() {
      const header = document.getElementById('table-header');
      const body = document.getElementById('table-body');
      
      header.innerHTML = '<th>País</th>';
      globalHistory.forEach((v, index) => {
        header.innerHTML += `<th title="${v.email} (${v.age} años)">Votante ${index + 1} (${v.lang})</th>`;
      });
      header.innerHTML += '<th>TOTAL</th>';

      let totals = {};
      countries.forEach(c => {
        totals[c.name] = globalHistory.reduce((sum, v) => sum + (v.votes[c.name] || 0), 0);
      });

      let sortedCountries = [...countries].sort((a, b) => totals[b.name] - totals[a.name]);

      body.innerHTML = '';
      sortedCountries.forEach(c => {
        let total = totals[c.name];
        let rowHtml = `<tr><td><strong>${c.name}</strong></td>`;
        
        globalHistory.forEach(v => {
          const val = v.votes[c.name] || 0;
          rowHtml += `<td>${val}</td>`;
        });

        rowHtml += `<td style="color:var(--accent-cyan); font-weight:700;">${total}</td></tr>`;
        body.innerHTML += rowHtml;
      });
    }

    function resetVotes() {
      if (confirm("¿Seguro que deseas eliminar TODOS los votos en Firebase?")) {
        db.ref('votes').remove().then(() => {
          globalHistory = [];
          renderSplitTable();
          alert("Base de datos reseteada.");
        });
      }
    }

    function exportCSV() {
      let csvContent = "data:text/csv;charset=utf-8,Pais";
      
      globalHistory.forEach((v, i) => csvContent += `,Votante ${i + 1} (${v.lang}) - ${v.email} (${v.age}a)`);
      csvContent += ",TOTAL\n";

      let totals = {};
      countries.forEach(c => {
        totals[c.name] = globalHistory.reduce((sum, v) => sum + (v.votes[c.name] || 0), 0);
      });
      let sortedCountries = [...countries].sort((a, b) => totals[b.name] - totals[a.name]);

      sortedCountries.forEach(c => {
        let total = totals[c.name];
        let line = `${c.name}`;
        globalHistory.forEach(v => {
          const val = v.votes[c.name] || 0;
          line += `,${val}`;
        });
        line += `,${total}\n`;
        csvContent += line;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "desglose_eurovision.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
